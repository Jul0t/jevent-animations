<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mon compte — JEvent</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>

<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-logo">
          <img src="/assets/jevent_logo.png" alt="Logo JEvent">
        </span>
        <span class="brand-name">JEvent</span>
      </a>

      <nav class="navigation">
        <a class="nav-link" href="/">Interactions</a>
        
        <a
          id="moderationLink"
          class="nav-link"
          href="/moderation.html"
          hidden
        >
          Modération
        </a>
      </nav>
    </header>

    <main>
      <section class="card">
        <div class="profile">
          <img id="avatar" class="profile-avatar" alt="Avatar Twitch">

          <div>
            <div class="profile-title-line">
              <h2 id="displayName">Chargement…</h2>

              <span
                id="moderatorBadge"
                class="moderator-badge"
              >
                Modérateur
              </span>
            </div>

            <p id="login" class="card-description"></p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Mes crédits</h2>

        <div class="stats-grid">
          <div class="stat">
            <span class="stat-label">Total donné</span>
            <strong id="totalDonated" class="stat-value">0 €</strong>
          </div>

          <div class="stat">
            <span class="stat-label">Obtenus</span>
            <strong id="granted" class="stat-value">0</strong>
          </div>

          <div class="stat">
            <span class="stat-label">Utilisés</span>
            <strong id="used" class="stat-value">0</strong>
          </div>

          <div class="stat">
            <span class="stat-label">Disponibles</span>
            <strong id="available" class="stat-value green">0</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Code de don</h2>

        <p class="card-description">
          Place ce code dans le message de ton prochain don.
        </p>

        <button id="createCode">Générer mon code</button>

        <div id="codeBox" hidden>
          <code id="code" class="claim-code"></code>
          <button id="copyCode" class="secondary full-width">
            Copier le code
          </button>
        </div>
      </section>

      <button id="logout" class="secondary">Se déconnecter</button>
      <p id="message" class="message"></p>
    </main>
  </div>

  <script>
    const API = "https://api.jevent.julot.fr";

    const avatar = document.querySelector("#avatar");
    const displayName = document.querySelector("#displayName");
    const login = document.querySelector("#login");
    const moderatorBadge =
      document.querySelector("#moderatorBadge");
    const moderationLink =
      document.querySelector("#moderationLink");

    const totalDonated = document.querySelector("#totalDonated");
    const granted = document.querySelector("#granted");
    const used = document.querySelector("#used");
    const available = document.querySelector("#available");
    const createCode = document.querySelector("#createCode");
    const codeBox = document.querySelector("#codeBox");
    const code = document.querySelector("#code");
    const copyCode = document.querySelector("#copyCode");
    const uploadLink = document.querySelector("#uploadLink");
    const logout = document.querySelector("#logout");
    const message = document.querySelector("#message");

    async function api(path, options = {}) {
      const response = await fetch(`${API}${path}`, {
        ...options,
        credentials: "include",
        headers: {
          ...(options.body
            ? { "Content-Type": "application/json" }
            : {})
        }
      });

      const data = await response.json();

      if (!response.ok) {
        if (response.status === 401) {
          location.href = "/";
        }

        throw new Error(data.error ?? "Erreur.");
      }

      return data;
    }

    function showCode(value) {
      code.textContent = value;
      codeBox.hidden = false;
      createCode.hidden = true;
    }

    async function load() {
      const data = await api("/api/account");

      avatar.src = data.user.profileImageUrl || "";
      displayName.textContent = data.user.displayName;
      login.textContent = `@${data.user.login}`;

      totalDonated.textContent =
        `${(data.totalDonatedCents / 100)
          .toFixed(2)
          .replace(".", ",")} €`;

      granted.textContent = data.creditsGranted;
      used.textContent = data.creditsUsed;
      available.textContent = data.creditsAvailable;

      moderatorBadge.classList.toggle(
        "visible",
        data.isModerator
      );

      moderationLink.hidden = !data.isModerator;

      uploadLink.classList.toggle(
        "disabled",
        !data.canUpload
      );

      const pending = data.claims.find(
        item => item.status === "pending"
      );

      if (pending) {
        showCode(pending.code);
      }
    }

    createCode.onclick = async () => {
      try {
        const data = await api("/api/claims", {
          method: "POST"
        });

        showCode(data.code);
      } catch (error) {
        message.textContent = error.message;
        message.className = "message visible error";
      }
    };

    copyCode.onclick = async () => {
      await navigator.clipboard.writeText(code.textContent);
      copyCode.textContent = "Code copié !";
    };

    logout.onclick = async () => {
      await api("/api/auth/logout", { method: "POST" });
      location.href = "/";
    };

    load().catch(error => {
      message.textContent = error.message;
      message.className = "message visible error";
    });

    setInterval(() => load().catch(() => {}), 5000);
  </script>
</body>
</html>
