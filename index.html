<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>JEvent — Images caritatives</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: dark;
      background: #111827;
      color: #f9fafb;
    }

    body {
      max-width: 750px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    main {
      padding: 30px;
      background: #1f2937;
      border-radius: 16px;
    }

    button,
    .button {
      display: inline-block;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #9147ff;
      color: white;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    #error {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #7f1d1d;
    }
  </style>
</head>

<body>
  <main>
    <h1>JEvent — Images caritatives</h1>

    <div id="error"></div>

    <p>
      Connecte-toi avec Twitch afin d’obtenir ton code
      de don et de gérer tes crédits d’image.
    </p>

    <a
      id="loginButton"
      class="button"
      href="#"
    >
      Se connecter avec Twitch
    </a>
  </main>

  <script>
    const API =
      "https://api.jevent.julot.fr";

    const loginButton =
      document.querySelector("#loginButton");

    const errorElement =
      document.querySelector("#error");

    loginButton.href =
      `${API}/api/auth/twitch/start`;

    const parameters =
      new URLSearchParams(location.search);

    const authError =
      parameters.get("authError");

    if (authError) {
      errorElement.style.display = "block";
      errorElement.textContent = authError;
    }

    async function checkSession() {
      try {
        const response = await fetch(
          `${API}/api/auth/me`,
          {
            credentials: "include"
          }
        );

        const data = await response.json();

        if (data.authenticated) {
          location.href = "/compte.html";
        }
      } catch {
        // Le bouton de connexion reste disponible.
      }
    }

    checkSession();
  </script>
</body>
</html>
