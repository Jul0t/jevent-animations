<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Découvrez les créateurs participant au JEvent 26 au profit de l’Association Petits Princes."
  >

  <title>Créateurs — JEvent 26</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #050b07;
      --background-soft: #08110b;
      --surface: rgba(15, 29, 19, 0.95);
      --surface-light: rgba(24, 43, 29, 0.96);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4fff7;
      --muted: #a8b8ad;
      --green: #00b237;
      --green-light: #38dc69;
      --red: #ff647c;
      --shadow:
        0 24px 70px rgba(0, 0, 0, 0.36);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;

      background:
        radial-gradient(
          circle at 8% 0%,
          rgba(0, 178, 55, 0.2),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          var(--background),
          var(--background-soft)
        );

      color: var(--text);
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .container {
      width: min(
        1180px,
        calc(100% - 32px)
      );

      margin: 0 auto;
      padding: 24px 0 80px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      margin-bottom: 42px;
      padding: 14px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;

      color: var(--text);
      text-decoration: none;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }

    .brand-title {
      display: block;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .brand-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .navigation a {
      padding: 10px 14px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: rgba(255, 255, 255, 0.03);
      text-decoration: none;
      font-weight: 750;
    }

    .navigation a:hover {
      border-color: var(--green);
      background: rgba(0, 178, 55, 0.1);
    }

    .hero {
      margin-bottom: 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 14px;
      padding: 7px 11px;

      border: 1px solid
        rgba(0, 178, 55, 0.45);

      border-radius: 999px;

      background: rgba(0, 178, 55, 0.1);
      color: #92ffb2;

      font-size: 0.8rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: var(--green);

      box-shadow:
        0 0 16px rgba(0, 178, 55, 0.85);
    }

    .hero h1 {
      max-width: 900px;
      margin: 0;

      font-size: clamp(
        2.5rem,
        8vw,
        5.5rem
      );

      line-height: 0.96;
      letter-spacing: -0.065em;
    }

    .hero p {
      max-width: 760px;
      margin: 20px 0 0;

      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      margin-bottom: 24px;
      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .event-status {
      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--muted);
      font-size: 0.92rem;
    }

    .event-status strong {
      color: var(--text);
    }

    .search-input {
      width: min(330px, 100%);
      padding: 11px 14px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--surface-light);
      color: var(--text);
    }

    .creator-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px, 1fr)
        );

      gap: 22px;
    }

    .creator-card {
      position: relative;
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: var(--surface);
      box-shadow: var(--shadow);

      transition:
        transform 170ms ease,
        border-color 170ms ease,
        opacity 170ms ease;
    }

    .creator-card:hover {
      transform: translateY(-4px);
      border-color:
        rgba(0, 178, 55, 0.5);
    }

    .creator-card.offline {
      opacity: 0.72;
      filter: saturate(0.65);
    }

    .creator-card.offline:hover {
      opacity: 0.95;
      filter: saturate(0.9);
    }

    .thumbnail-link {
      position: relative;
      display: block;
      height: 180px;

      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          rgba(0, 178, 55, 0.22),
          rgba(0, 0, 0, 0.65)
        );

      text-decoration: none;
    }

    .thumbnail {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      transition: transform 240ms ease;
    }

    .creator-card:hover .thumbnail {
      transform: scale(1.035);
    }

    .offline-background {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;

      color: rgba(255, 255, 255, 0.25);
      font-size: 4rem;
      font-weight: 950;
      letter-spacing: -0.08em;
    }

    .live-badge {
      position: absolute;
      top: 12px;
      left: 12px;

      padding: 6px 9px;

      border-radius: 7px;
      background: var(--red);
      color: white;

      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .viewer-badge {
      position: absolute;
      right: 12px;
      bottom: 12px;

      padding: 6px 9px;

      border-radius: 7px;
      background: rgba(0, 0, 0, 0.76);
      color: white;

      font-size: 0.76rem;
      font-weight: 800;
    }

    .creator-content {
      padding: 18px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar-link {
      display: block;
      flex: 0 0 auto;
    }

    .creator-avatar {
      display: block;
      width: 58px;
      height: 58px;

      border: 3px solid
        rgba(0, 178, 55, 0.45);

      border-radius: 50%;
      object-fit: cover;

      background: var(--surface-light);
    }

    .creator-name {
      overflow: hidden;
      margin: 0;

      font-size: 1.18rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .creator-login {
      overflow: hidden;
      margin: 5px 0 0;

      color: var(--muted);
      font-size: 0.87rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stream-title {
      min-height: 44px;
      margin: 15px 0 0;

      color: #dce9df;
      line-height: 1.45;

      display: -webkit-box;
      overflow: hidden;

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .stream-category {
      margin: 8px 0 0;
      color: #8effaf;
      font-size: 0.84rem;
      font-weight: 750;
    }

    .offline-message {
      min-height: 44px;
      margin: 15px 0 0;

      color: var(--muted);
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
      margin-top: 17px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 10px 13px;

      border-radius: 10px;

      background: var(--green);
      color: #001c08;

      text-align: center;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 900;
    }

    .button:hover {
      background: var(--green-light);
    }

    .button.secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .button.secondary:hover {
      border-color: var(--green);
      background: rgba(0, 178, 55, 0.1);
    }

    .button.disabled {
      pointer-events: none;
      cursor: not-allowed;
      opacity: 0.42;
    }

    .empty-state,
    .error-state {
      grid-column: 1 / -1;

      padding: 55px 24px;

      border: 1px dashed var(--border);
      border-radius: 18px;

      color: var(--muted);
      text-align: center;
      line-height: 1.65;
    }

    .loading {
      display: grid;
      min-height: 340px;
      place-items: center;

      color: var(--muted);
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;

      border: 4px solid
        rgba(255, 255, 255, 0.1);

      border-top-color: var(--green);
      border-radius: 50%;

      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 700px) {
      .site-header,
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .search-input {
        width: 100%;
      }

      .brand-logo {
        width: 56px;
        height: 56px;
      }
    }

    @media (max-width: 430px) {
      .container {
        width: min(
          100% - 22px,
          1180px
        );
      }

      .creator-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="/">
        <img
          class="brand-logo"
          src="/assets/jevent_logo.png"
          alt="Logo du JEvent 26"
        >

        <span>
          <span class="brand-title">
            JEvent 26
          </span>

          <span class="brand-subtitle">
            Association Petits Princes
          </span>
        </span>
      </a>

      <nav
        class="navigation"
        aria-label="Navigation principale"
      >
        <a href="/">Accueil</a>
        <a href="/programme.html">Programme</a>
        <a href="/compte.html">Mon compte</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">
          <span
            class="eyebrow-dot"
            aria-hidden="true"
          ></span>

          JEvent 26
        </div>

        <h1>Les créateurs</h1>

        <p>
          Retrouve les chaînes participant à l’événement du
          25 au 27 octobre 2026. Les chaînes actuellement en
          direct sont affichées en premier.
        </p>
      </section>

      <section class="toolbar">
        <div class="event-status">
          <strong id="liveCount">—</strong>
          <span id="liveLabel">
            chaîne en direct
          </span>

          <span aria-hidden="true">•</span>

          <span id="totalCount">
            — créateur
          </span>
        </div>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Rechercher un créateur…"
          autocomplete="off"
        >
      </section>

      <section
        id="loading"
        class="loading"
      >
        <div>
          <div
            class="spinner"
            aria-hidden="true"
          ></div>

          <p>
            Chargement des créateurs…
          </p>
        </div>
      </section>

      <section
        id="creatorGrid"
        class="creator-grid"
        hidden
      ></section>
    </main>
  </div>

  <script>
    const API_URL =
      "https://api-beta.jevent.julot.fr";

    const loading =
      document.querySelector("#loading");

    const creatorGrid =
      document.querySelector("#creatorGrid");

    const liveCount =
      document.querySelector("#liveCount");

    const liveLabel =
      document.querySelector("#liveLabel");

    const totalCount =
      document.querySelector("#totalCount");

    const searchInput =
      document.querySelector("#searchInput");

    let creators = Array.of();

    function profileUrl(creator) {
      return (
        "/createur.html?slug=" +
        encodeURIComponent(creator.slug)
      );
    }

    function formatViewerCount(value) {
      return new Intl.NumberFormat(
        "fr-FR"
      ).format(Number(value ?? 0));
    }

    function makeTextElement(
      tagName,
      className,
      text
    ) {
      const element =
        document.createElement(tagName);

      element.className = className;
      element.textContent = text;

      return element;
    }

    function createActionLink(
      text,
      href,
      secondary = false
    ) {
      const link =
        document.createElement("a");

      link.className =
        secondary
          ? "button secondary"
          : "button";

      link.textContent = text;

      if (href) {
        link.href = href;
      } else {
        link.href = "#";
        link.classList.add("disabled");
        link.setAttribute(
          "aria-disabled",
          "true"
        );
      }

      return link;
    }

    function createCreatorCard(creator) {
      const card =
        document.createElement("article");

      card.className =
        creator.isLive
          ? "creator-card"
          : "creator-card offline";

      const thumbnailLink =
        document.createElement("a");

      thumbnailLink.className =
        "thumbnail-link";

      thumbnailLink.href =
        profileUrl(creator);

      if (
        creator.isLive &&
        creator.live?.thumbnailUrl
      ) {
        const thumbnail =
          document.createElement("img");

        thumbnail.className = "thumbnail";
        thumbnail.src =
          creator.live.thumbnailUrl;

        thumbnail.alt =
          `Aperçu du live de ` +
          creator.twitchDisplayName;

        thumbnail.loading = "lazy";

        thumbnailLink.append(thumbnail);

        const liveBadge =
          makeTextElement(
            "span",
            "live-badge",
            "En direct"
          );

        const viewerBadge =
          makeTextElement(
            "span",
            "viewer-badge",
            formatViewerCount(
              creator.live.viewerCount
            ) +
              " spectateur" +
              (
                Number(
                  creator.live.viewerCount
                ) > 1
                  ? "s"
                  : ""
              )
          );

        thumbnailLink.append(
          liveBadge,
          viewerBadge
        );
      } else {
        const offlineBackground =
          makeTextElement(
            "div",
            "offline-background",
            "OFF"
          );

        thumbnailLink.append(
          offlineBackground
        );
      }

      const content =
        document.createElement("div");

      content.className =
        "creator-content";

      const identity =
        document.createElement("div");

      identity.className = "identity";

      const avatarLink =
        document.createElement("a");

      avatarLink.className =
        "avatar-link";

      avatarLink.href =
        profileUrl(creator);

      const avatar =
        document.createElement("img");

      avatar.className = "creator-avatar";

      avatar.src =
        creator.twitchProfileImageUrl ||
        "/assets/jevent_logo.png";

      avatar.alt =
        `Avatar de ` +
        creator.twitchDisplayName;

      avatar.loading = "lazy";

      avatarLink.append(avatar);

      const nameBlock =
        document.createElement("div");

      nameBlock.style.minWidth = "0";

      const name =
        makeTextElement(
          "h2",
          "creator-name",
          creator.twitchDisplayName
        );

      const login =
        makeTextElement(
          "p",
          "creator-login",
          `@${creator.twitchLogin}`
        );

      nameBlock.append(name, login);
      identity.append(
        avatarLink,
        nameBlock
      );

      content.append(identity);

      if (creator.isLive) {
        content.append(
          makeTextElement(
            "p",
            "stream-title",
            creator.live?.title ||
              "Live du JEvent 26"
          )
        );

        content.append(
          makeTextElement(
            "p",
            "stream-category",
            creator.live?.gameName ||
              "Catégorie non renseignée"
          )
        );
      } else {
        content.append(
          makeTextElement(
            "p",
            "offline-message",
            "Cette chaîne est actuellement hors ligne."
          )
        );
      }

      const actions =
        document.createElement("div");

      actions.className = "actions";

      actions.append(
        createActionLink(
          "Découvrir",
          profileUrl(creator),
          true
        ),

        createActionLink(
          "Faire un don",
          creator.donationUrl,
          false
        )
      );

      content.append(actions);

      card.append(
        thumbnailLink,
        content
      );

      return card;
    }

    function getFilteredCreators() {
      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      if (!search) {
        return creators;
      }

      return creators.filter(creator => {
        const content =
          Array.of(
            creator.twitchDisplayName,
            creator.twitchLogin,
            creator.live?.title,
            creator.live?.gameName
          )
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

        return content.includes(search);
      });
    }

    function renderCreators() {
      const filtered =
        getFilteredCreators();

      creatorGrid.replaceChildren();

      if (filtered.length === 0) {
        const empty =
          document.createElement("div");

        empty.className = "empty-state";

        empty.textContent =
          searchInput.value.trim()
            ? "Aucun créateur ne correspond à cette recherche."
            : "Aucun créateur n’est encore affiché.";

        creatorGrid.append(empty);
        return;
      }

      for (const creator of filtered) {
        creatorGrid.append(
          createCreatorCard(creator)
        );
      }
    }

    async function loadCreators() {
      try {
        const response = await fetch(
          API_URL + "/api/creators"
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ??
            `Erreur HTTP ${response.status}`
          );
        }

        creators =
          data.creators ?? Array.of();

        liveCount.textContent =
          String(data.liveCount ?? 0);

        liveLabel.textContent =
          Number(data.liveCount) > 1
            ? "chaînes en direct"
            : "chaîne en direct";

        totalCount.textContent =
          `${data.total ?? creators.length} ` +
          (
            Number(
              data.total ??
              creators.length
            ) > 1
              ? "créateurs"
              : "créateur"
          );

        renderCreators();

        loading.hidden = true;
        creatorGrid.hidden = false;
      } catch (error) {
        loading.hidden = true;
        creatorGrid.hidden = false;

        const state =
          document.createElement("div");

        state.className = "error-state";

        state.textContent =
          "Impossible de charger les créateurs : " +
          error.message;

        creatorGrid.replaceChildren(state);
      }
    }

    searchInput.addEventListener(
      "input",
      renderCreators
    );

    loadCreators();
  </script>
</body>
</html>
