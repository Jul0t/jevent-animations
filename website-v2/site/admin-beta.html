<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Administration bêta — JEvent 26
    </title>

    <style>
        :root {
            color-scheme: dark;

            --background: #071009;
            --surface: #101c13;
            --surface-light: #17261b;
            --border: rgba(255, 255, 255, 0.12);
            --text: #f7fff9;
            --muted: #a8b9ad;
            --green: #00b237;
            --green-light: #36db69;
            --red: #ff647c;

            font-family:
                Inter, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            background:
                radial-gradient(circle at 10% 0%,
                    rgba(0, 178, 55, 0.2),
                    transparent 35%),
                var(--background);

            color: var(--text);
        }

        .container {
            width: min(1000px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 80px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .logo {
            display: block;
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.8rem);
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .card {
            margin-bottom: 22px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(16, 28, 19, 0.92);
        }

        .card h2 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 750;
        }

        input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--surface-light);
            color: var(--text);

            font: inherit;
        }

        input:focus {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        button {
            padding: 13px 18px;
            border: 0;
            border-radius: 12px;
            background: var(--green);
            color: #001e09;
            font: inherit;
            font-weight: 850;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--green-light);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .secondary {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .preview {
            display: none;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
            padding: 18px;
            border-radius: 16px;
            background: var(--surface-light);
        }

        .preview.visible {
            display: flex;
        }

        .preview img {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
        }

        .preview h3 {
            margin: 0 0 5px;
        }

        .preview p {
            margin: 0;
            color: var(--muted);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
        }

        .message.visible {
            display: block;
        }

        .message.success {
            background: rgba(0, 178, 55, 0.16);
            color: #8dffaf;
        }

        .message.error {
            background: rgba(255, 100, 124, 0.15);
            color: #ffc0ca;
        }

        .message.info {
            background: rgba(78, 143, 255, 0.15);
            color: #c7d9ff;
        }

        pre {
            overflow: auto;
            max-height: 450px;
            padding: 18px;
            border-radius: 14px;
            background: #050b06;
            color: #c6ffd7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            .logo {
                width: 56px;
                height: 56px;
            }

            .preview {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <img class="logo" src="jevent_logo.png" alt="Logo JEvent 26">

            <div>
                <h1>Administration bêta</h1>

                <p class="subtitle">
                    Préinscription des créateurs du JEvent 26
                </p>
            </div>
        </header>

        <section class="card">
            <h2>Session administrateur</h2>

            <p id="accountStatus">
                Vérification de ta session…
            </p>
        </section>

        <section id="creatorSection" class="card" hidden>
            <h2>Ajouter un créateur</h2>

            <div class="field">
                <label for="twitchLogin">
                    Login Twitch
                </label>

                <input id="twitchLogin" type="text" autocomplete="off" placeholder="Exemple : julot">
            </div>

            <div class="actions">
                <button id="searchButton" type="button">
                    Rechercher sur Twitch
                </button>
            </div>

            <div id="creatorPreview" class="preview">
                <img id="creatorAvatar" src="" alt="">

                <div>
                    <h3 id="creatorName"></h3>
                    <p id="creatorLogin"></p>
                </div>
            </div>

            <form id="creatorForm" hidden>
                <div class="field">
                    <label for="creatorSlug">
                        Slug de la page
                    </label>

                    <input id="creatorSlug" type="text" required placeholder="nom-createur">
                </div>

                <div class="field">
                    <label for="streamlabsMemberId">
                        Identifiant membre Streamlabs
                    </label>

                    <input id="streamlabsMemberId" type="text" placeholder="Facultatif pour le moment">
                </div>

                <div class="field">
                    <label for="displayOrder">
                        Ordre d’affichage
                    </label>

                    <input id="displayOrder" type="number" min="0" max="1000" value="100">
                </div>

                <button id="createButton" type="submit">
                    Préinscrire ce créateur
                </button>
            </form>

            <div id="message" class="message" role="status"></div>
        </section>

        <section id="creatorListSection" class="card" hidden>
            <div class="actions">
                <h2>Créateurs inscrits</h2>

                <button id="reloadCreatorsButton" class="secondary" type="button">
                    Actualiser
                </button>
            </div>

            <div id="creatorList"></div>
        </section>

        <section class="card">
            <h2>Réponse de l’API</h2>

            <pre id="debugOutput">
Aucune requête effectuée.
      </pre>
        </section>
    </main>

    <script>
        const API_URL =
            "https://api-beta.jevent.julot.fr";

        const accountStatus =
            document.querySelector("#accountStatus");

        const creatorSection =
            document.querySelector("#creatorSection");

        const twitchLogin =
            document.querySelector("#twitchLogin");

        const searchButton =
            document.querySelector("#searchButton");

        const creatorPreview =
            document.querySelector("#creatorPreview");

        const creatorAvatar =
            document.querySelector("#creatorAvatar");

        const creatorName =
            document.querySelector("#creatorName");

        const creatorLogin =
            document.querySelector("#creatorLogin");

        const creatorForm =
            document.querySelector("#creatorForm");

        const creatorSlug =
            document.querySelector("#creatorSlug");

        const streamlabsMemberId =
            document.querySelector(
                "#streamlabsMemberId"
            );

        const displayOrder =
            document.querySelector("#displayOrder");

        const createButton =
            document.querySelector("#createButton");

        const message =
            document.querySelector("#message");

        const debugOutput =
            document.querySelector("#debugOutput");

        const creatorListSection =
            document.querySelector(
                "#creatorListSection"
            );

        const creatorList =
            document.querySelector("#creatorList");

        const reloadCreatorsButton =
            document.querySelector(
                "#reloadCreatorsButton"
            );

        let selectedTwitchUser = null;

        function showMessage(text, type = "info") {
            message.textContent = text;
            message.className =
                `message visible ${type}`;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function displayDebug(data) {
            debugOutput.textContent =
                JSON.stringify(data, null, 2);
        }

        async function apiFetch(
            pathname,
            options = {}
        ) {
            const response = await fetch(
                `${API_URL}${pathname}`,
                {
                    ...options,
                    credentials: "include",
                    headers: {
                        ...(options.body
                            ? {
                                "Content-Type":
                                    "application/json"
                            }
                            : {}),
                        ...(options.headers ?? {})
                    }
                }
            );

            const data = await response.json();

            displayDebug({
                status: response.status,
                data
            });

            if (!response.ok) {
                throw new Error(
                    data.error ??
                    `Erreur HTTP ${response.status}`
                );
            }

            return data;
        }

        async function loadCreators() {
            try {
                const data = await apiFetch(
                    "/api/admin/creators"
                );

                creatorListSection.hidden = false;

                if (data.creators.length === 0) {
                    creatorList.innerHTML =
                        "<p>Aucun créateur inscrit.</p>";

                    return;
                }

                creatorList.replaceChildren();

                for (const creator of data.creators) {
                    const container =
                        document.createElement("article");

                    container.className = "preview visible";

                    const avatar =
                        document.createElement("img");

                    avatar.src =
                        creator.twitchProfileImageUrl ?? "";

                    avatar.alt =
                        `Avatar de ` +
                        creator.twitchDisplayName;

                    const information =
                        document.createElement("div");

                    const title =
                        document.createElement("h3");

                    title.textContent =
                        creator.twitchDisplayName;

                    const details =
                        document.createElement("p");

                    details.textContent =
                        `@${creator.twitchLogin} · ` +
                        `/${creator.slug} · ` +
                        (
                            creator.claimed
                                ? "Compte lié"
                                : "En attente de connexion"
                        );

                    information.append(
                        title,
                        details
                    );

                    container.append(
                        avatar,
                        information
                    );

                    creatorList.append(container);
                }
            } catch (error) {
                showMessage(
                    error.message,
                    "error"
                );
            }
        }

        async function loadAccount() {
            try {
                const data = await apiFetch(
                    "/api/auth/me"
                );

                if (!data.authenticated) {
                    accountStatus.textContent =
                        "Tu dois te connecter avec Twitch.";

                    window.location.href =
                        `${API_URL}/api/auth/twitch/start` +
                        "?returnTo=" +
                        encodeURIComponent(
                            "/admin-beta.html"
                        );

                    return;
                }

                if (
                    !data.user.permissions
                        .isSuperAdmin
                ) {
                    accountStatus.textContent =
                        "Accès refusé : tu n’es pas super administrateur.";

                    return;
                }

                accountStatus.textContent =
                    `Connecté en tant que ` +
                    `${data.user.displayName}.`;

                creatorSection.hidden = false;
                creatorListSection.hidden = false;
                await loadCreators();

            } catch (error) {
                accountStatus.textContent =
                    error.message;
            }
        }

        async function searchCreator() {
            clearMessage();

            const login =
                twitchLogin.value
                    .trim()
                    .replace(/^@+/, "")
                    .toLowerCase();

            if (!login) {
                showMessage(
                    "Saisis un login Twitch.",
                    "error"
                );

                return;
            }

            searchButton.disabled = true;

            try {
                const data = await apiFetch(
                    "/api/admin/twitch/search?login=" +
                    encodeURIComponent(login)
                );

                selectedTwitchUser =
                    data.twitchUser;

                creatorAvatar.src =
                    selectedTwitchUser
                        .profileImageUrl ?? "";

                creatorAvatar.alt =
                    `Avatar de ` +
                    selectedTwitchUser.displayName;

                creatorName.textContent =
                    selectedTwitchUser.displayName;

                creatorLogin.textContent =
                    `@${selectedTwitchUser.login}`;

                creatorSlug.value =
                    data.suggestedSlug ??
                    selectedTwitchUser.login;

                creatorPreview.classList.add(
                    "visible"
                );

                creatorForm.hidden = false;

                showMessage(
                    "Compte Twitch trouvé.",
                    "success"
                );
            } catch (error) {
                selectedTwitchUser = null;

                creatorPreview.classList.remove(
                    "visible"
                );

                creatorForm.hidden = true;

                showMessage(
                    error.message,
                    "error"
                );
            } finally {
                searchButton.disabled = false;
            }
        }

        async function createCreator(event) {
            event.preventDefault();
            clearMessage();

            if (!selectedTwitchUser) {
                showMessage(
                    "Recherche d’abord le compte Twitch.",
                    "error"
                );

                return;
            }

            createButton.disabled = true;

            try {
                const data = await apiFetch(
                    "/api/admin/creators",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            twitchLogin:
                                selectedTwitchUser.login,

                            slug:
                                creatorSlug.value.trim(),

                            streamlabsMemberId:
                                streamlabsMemberId
                                    .value
                                    .trim(),

                            displayOrder:
                                Number(
                                    displayOrder.value
                                )
                        })
                    }
                );

                showMessage(
                    `Le créateur ${data.creator
                        .twitch_display_name ??
                    selectedTwitchUser.displayName} ` +
                    `a été préinscrit.`,
                    "success"
                );

                creatorForm.reset();
                creatorForm.hidden = true;

                creatorPreview.classList.remove(
                    "visible"
                );

                selectedTwitchUser = null;
            } catch (error) {
                showMessage(
                    error.message,
                    "error"
                );
            } finally {
                createButton.disabled = false;
            }
        }

        searchButton.addEventListener(
            "click",
            searchCreator
        );

        creatorForm.addEventListener(
            "submit",
            createCreator
        );

        loadAccount();
    </script>
</body>

</html>
