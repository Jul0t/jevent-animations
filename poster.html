<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Envoyer une image — JEvent</title>

  <style>
    :root {
      --background: #070816;
      --surface: rgba(22, 24, 48, 0.86);
      --surface-light: rgba(36, 39, 72, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #aeb5cc;
      --purple: #9147ff;
      --purple-light: #b98aff;
      --green: #36d399;
      --yellow: #fbbf24;
      --red: #fb7185;

      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

      color-scheme: dark;
      background: var(--background);
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(145, 71, 255, 0.22),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(54, 211, 153, 0.12),
          transparent 30%
        ),
        var(--background);
    }

    .container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text);
      text-decoration: none;
    }

    .logo {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background:
        linear-gradient(135deg, #9147ff, #5320a8);
      box-shadow: 0 10px 35px rgba(145, 71, 255, 0.35);
      font-size: 25px;
      font-weight: 900;
    }

    .brand-name {
      display: block;
      font-size: 1.25rem;
      font-weight: 850;
    }

    .brand-subtitle {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.83rem;
    }

    .back-link {
      color: #d7c3ff;
      text-decoration: none;
    }

    .hero {
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 6vw, 3.7rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.65;
    }

    .card {
      margin-bottom: 22px;
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(14px);
    }

    .balance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
      padding: 16px 18px;
      border-radius: 15px;
      background: var(--surface-light);
    }

    .balance strong {
      color: var(--green);
      font-size: 1.45rem;
    }

    .drop-zone {
      display: block;
      padding: 35px 20px;
      border: 2px dashed rgba(185, 138, 255, 0.45);
      border-radius: 18px;
      background: rgba(145, 71, 255, 0.055);
      text-align: center;
      cursor: pointer;
      transition:
        border-color 160ms ease,
        transform 160ms ease,
        background 160ms ease;
    }

    .drop-zone:hover {
      transform: translateY(-2px);
      border-color: var(--purple-light);
      background: rgba(145, 71, 255, 0.11);
    }

    .drop-zone input {
      display: none;
    }

    .drop-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .file-name {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background:
        linear-gradient(135deg, var(--purple), #6d28d9);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(145, 71, 255, 0.25);
    }

    button:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      border-radius: 12px;
      line-height: 1.45;
    }

    .message.visible {
      display: block;
    }

    .message.info {
      background: rgba(59, 130, 246, 0.13);
      color: #bfdbfe;
    }

    .message.success {
      background: rgba(54, 211, 153, 0.12);
      color: #a7f3d0;
    }

    .message.error {
      background: rgba(251, 113, 133, 0.12);
      color: #fecdd3;
    }

    .uploads-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .upload-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
    }

    .upload-card img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.35);
    }

    .upload-details {
      padding: 16px;
    }

    .upload-name {
      overflow: hidden;
      margin: 0 0 10px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .status.pending {
      background: rgba(251, 191, 36, 0.14);
      color: var(--yellow);
    }

    .status.approved {
      background: rgba(54, 211, 153, 0.14);
      color: var(--green);
    }

    .status.rejected {
      background: rgba(251, 113, 133, 0.14);
      color: var(--red);
    }

    .empty {
      padding: 30px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a class="brand" href="/compte.html">
        <span class="logo" aria-hidden="true">J</span>

        <span>
          <span class="brand-name">JEvent</span>
          <span class="brand-subtitle">
            Live caritatif • Créatures communautaires
          </span>
        </span>
